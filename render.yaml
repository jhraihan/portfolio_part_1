# Render blueprint — deploys both services from this repository.
#
# The database is NOT defined here: it lives on Neon, whose free tier does not
# expire after 30 days the way Render's does. Set DATABASE_URL manually from
# the Neon connection string (see DEPLOYMENT.md).
#
# After the first deploy, set the two cross-referencing values that cannot be
# known in advance: CORS/CSRF origins on the backend, and VITE_API_URL on the
# frontend.

services:
  # ---------------------------------------------------------------------
  # Django API
  # ---------------------------------------------------------------------
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    region: singapore          # closest free region to Bangladesh
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/profile/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      # Generated once by Render and kept across deploys.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: USE_SQLITE
        value: "False"

      # Paste the Neon connection string here in the dashboard.
      - key: DATABASE_URL
        sync: false

      # Render injects the service's own hostname.
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: portfolio-api
          property: host

      # Set to the deployed frontend URL after its first deploy.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # Render terminates TLS ahead of the app, so Django must not also
      # redirect or requests loop.
      - key: SECURE_SSL_REDIRECT
        value: "False"

  # ---------------------------------------------------------------------
  # React frontend
  # ---------------------------------------------------------------------
  - type: web
    name: portfolio-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      # Set to the API service URL, with the /api suffix, after its first
      # deploy: https://portfolio-api-xxxx.onrender.com/api
      - key: VITE_API_URL
        sync: false

    routes:
      # Client-side routing: every unknown path must serve index.html, or a
      # refresh on /projects/micromart returns 404.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
